name: .NET Core Desktop
on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]
jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v2

    - name: Debug - find sln files
      run: Get-ChildItem -Recurse -Filter *.sln | Select-Object FullName
      shell: pwsh

    - name: Execute unit tests
      run: dotnet test Flow/Flow.sln

